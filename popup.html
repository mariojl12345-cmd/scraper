<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: Arial, sans-serif; width: 320px; padding: 10px; }
      textarea { width: 100%; height: 110px; }
      button { width: 100%; margin-top: 8px; padding: 10px; cursor: pointer; }
      pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 8px; border-radius: 6px; }
      .row { display: flex; gap: 8px; }
      .row button { width: 50%; }
    </style>
  </head>
  <body>
    <textarea id="prompt" placeholder="Describe change prompt..."></textarea>

    <button id="run">Run on this product</button>

    <div class="row">
      <button id="copyNext">Copy next pending</button>
      <button id="zipPending">Zip pending</button>
    </div>

    <pre id="status">Ready.</pre>

    <script src="popup.js"></script>
  </body>
</html>
